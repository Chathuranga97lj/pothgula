name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm build:shared

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The counter in a real browser: the built API and web app on a throwaway
  # database (see e2e/playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pothgula
          POSTGRES_USER: pothgula
          POSTGRES_PASSWORD: pothgula-dev-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pothgula -d pothgula"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm --filter @pothgula/e2e exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm --filter @pothgula/e2e e2e

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # NFR-08, NFR-13: the production setup file on a clean machine — build, start,
  # first super admin, sign in through the web server, then a backup and a
  # restore rehearsal.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Settings
        run: |
          printf 'SITE_ADDRESS=:80\nPOSTGRES_PASSWORD=%s\nHTTP_PORT=8080\nHTTPS_PORT=8443\n' \
            "$(openssl rand -hex 24)" > .env

      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Sign in through the web server
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS -o /dev/null http://localhost:8080/counter
          out=$(docker compose exec -T api node dist/cli/create-super-admin.js --name "CI Admin" --phone 0770001234)
          pw=$(echo "$out" | sed -n 's/Temporary password: //p')
          curl -fsS -X POST http://localhost:8080/api/auth/sign-in -H 'content-type: application/json' \
            -d "{\"whatsappPhone\":\"0770001234\",\"password\":\"$pw\"}" > /dev/null

      - name: Backup and restore rehearsal
        run: |
          docker compose exec -T backup sh /scripts/backup-now.sh
          docker compose exec -T backup sh /scripts/restore-rehearsal.sh

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
