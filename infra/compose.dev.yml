# Development database only. The production compose file (API, web, Postgres,
# backups) arrives with milestone M8.
name: pothgula-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pothgula
      POSTGRES_USER: pothgula
      POSTGRES_PASSWORD: pothgula-dev-only
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pothgula -d pothgula']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
