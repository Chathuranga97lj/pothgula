# Pothgula, the whole system from one file (NFR-13). From this folder:
#   cp .env.example .env    # then edit it
#   docker compose up -d --build
# docs/setup.md walks through installation, the first super admin, backups and
# restoring. Nothing here needs an account with any outside service (NFR-11).
name: pothgula

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pothgula
      POSTGRES_USER: pothgula
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
      TZ: Asia/Colombo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pothgula -d pothgula']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    image: pothgula-api:${POTHGULA_VERSION:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pothgula:${POSTGRES_PASSWORD}@db:5432/pothgula
      # The web container is the only proxy, on the private Docker network.
      TRUST_PROXY: uniquelocal
      APP_VERSION: ${POTHGULA_VERSION:-0.1.0}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    image: pothgula-web:${POTHGULA_VERSION:-local}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  # NFR-08: a full copy of the database every night, the newest 30 kept in
  # infra/backups. Copy them off the server weekly (backup/copy-off-server.*).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/scripts/backup-loop.sh']
    environment:
      PGHOST: db
      PGUSER: pothgula
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: pothgula
      TZ: Asia/Colombo
      BACKUP_AT: ${BACKUP_AT:-01:30}
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
    volumes:
      - ./backup:/scripts:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
